        - generic [ref=e90]: 不服一审判决 · 十五日内上诉
        - generic [ref=e91]: 二审裁判 · 即刻生效
        - generic [ref=e92]: 不上诉 · 十五日后生效
        - generic [ref=e93]: 标的额小 · 适用小额程序
        - generic [ref=e94]: 对生效判决不服 · 六个月内申请再审
