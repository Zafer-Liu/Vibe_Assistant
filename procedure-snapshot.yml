    - generic [ref=e127]:
      - heading "打官司之前或打官司之中，也可以试试这些" [level=4] [ref=e128]
      - paragraph [ref=e129]: 成本低、见效快的非诉讼途径，很多纠纷不必对簿公堂。
      - generic [ref=e130]:
        - article [ref=e131]:
          - heading "协商和解" [level=5] [ref=e133]
          - paragraph [ref=e134]: 主动权在自己手里，成本最低。重要的和解协议写清楚：谁、向谁、于何时、支付或履行什么、违约怎么办。
        - article [ref=e135]:
          - heading "人民调解" [level=5] [ref=e137]
          - paragraph [ref=e138]: 村委会、居委会、人民调解委员会都可以主持调解；达成的调解协议可以共同向法院申请司法确认，确认后具有强制执行力。
          - button "去问法晓" [ref=e140] [cursor=pointer]
        - article [ref=e141]:
          - heading "诉讼中也能调解" [level=5] [ref=e143]
          - paragraph [ref=e144]: 开庭前后随时可以调解。调解书经双方当事人签收后即具有法律效力，对方不履行可以直接申请强制执行——和判决一样有用。
          - paragraph [ref=e146]:
            - generic [ref=e147]: 依据
            - text: 《民事诉讼法》第一百条
        - article [ref=e148]:
          - heading "劳动仲裁" [level=5] [ref=e150]
          - paragraph [ref=e151]: 劳动争议要先申请劳动仲裁（不收费），对裁决不服才能向法院起诉；仲裁时效 1 年，在职期间追讨拖欠的劳动报酬不受此限。
          - paragraph [ref=e153]:
            - generic [ref=e154]: 依据
            - text: 《劳动争议调解仲裁法》第二十七条
        - article [ref=e155]:
          - heading "行政投诉" [level=5] [ref=e157]
          - paragraph [ref=e158]: 消费纠纷打 12315、劳动保障打 12333、金融消费打 12378——行政机关的调查和处理，有时比诉讼更快。
