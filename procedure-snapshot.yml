      - generic [ref=e14]:
        - heading "诉讼流程" [level=1] [ref=e15]
        - paragraph [ref=e16]: 从起诉、一审二审到再审执行：看懂主线怎么走、支线何时用，以及不打官司的替代办法。
        - paragraph [ref=e17]: 内容整理时间：2026年10月
    - generic [ref=e18]:
      - heading "一场官司，通常这样走" [level=4] [ref=e19]
      - paragraph [ref=e20]: 先看中间的红色主线；下面是遇到特殊情况时才会走的支线。
      - generic [ref=e21]:
        - generic [ref=e22]: 出发
        - article [ref=e27]:
          - generic [ref=e28]:
            - generic [ref=e29]: "1"
            - strong [ref=e30]: 起诉在哪里？
            - generic [ref=e31]: 第一步 · 管辖
          - paragraph [ref=e32]: 先确定去哪家法院：通常到被告住所地的基层法院。合同、不动产等纠纷，可能有特殊规则。
          - list [ref=e33]:
            - listitem [ref=e34]: 不确定时，先问 12348 或法院立案窗口。
        - article [ref=e35]:
          - generic [ref=e36]:
            - generic [ref=e37]: "2"
            - strong [ref=e38]: 立案与一审
            - generic [ref=e39]: 对簿公堂
          - paragraph [ref=e40]: 准备起诉状和证据，提交给法院。法院受理后会通知你开庭，最后作出一审判决。
          - list [ref=e41]:
            - listitem [ref=e42]: 证据尽量保留原件或完整记录，不要只留截图。
        - article [ref=e43]:
          - generic [ref=e44]:
            - generic [ref=e45]: "3"
            - strong [ref=e46]: 二审 · 终审
            - generic [ref=e47]: 两审终审
          - paragraph [ref=e48]: 如果不服一审判决，可以在收到判决书后 15 天内上诉。二审判决通常就是最终结果。
          - list [ref=e49]:
            - listitem [ref=e50]: 上诉时写清楚：一审哪里错了、你希望怎么改。
        - article [ref=e51]:
          - generic [ref=e52]:
            - generic [ref=e53]: "4"
            - strong [ref=e54]: 生效与执行
            - generic [ref=e55]: 终点站
          - paragraph [ref=e56]: 判决生效后，如果对方还不履行，可以向法院申请强制执行。一般要在 2 年内申请。
          - list [ref=e57]:
            - listitem [ref=e58]: 保留对方财产线索，申请执行时一起提交。
        - article [ref=e59]:
          - generic [ref=e60]:
            - generic [ref=e61]: A
            - strong [ref=e62]: 小额诉讼 · 一审终审
            - generic [ref=e63]: 支线 · 快车道
          - paragraph [ref=e64]: 如果金额较小、事实也比较清楚，可能走更快的小额诉讼：一审就是最终结果，判决后可以申请执行。
        - article [ref=e65]:
          - generic [ref=e66]:
            - generic [ref=e67]: B
            - strong [ref=e68]: 再审 · 审判监督
            - generic [ref=e69]: 支线 · 救济线
          - paragraph [ref=e70]: 判决已经生效，但你认为确实有重大错误，可以申请再审。这不是普通的“第三次上诉”，要符合特定条件。
          - list [ref=e71]:
            - listitem [ref=e72]: 申请再审通常要在判决生效后 6 个月内提出。
        - article [ref=e73]:
          - generic [ref=e74]:
            - generic [ref=e75]: C
            - strong [ref=e76]: 检察监督 · 抗诉
            - generic [ref=e77]: 支线 · 检察监督
          - paragraph [ref=e78]: 如果法院处理后仍有明显问题，可以向检察院申请检察监督。符合条件的，检察院可能提出抗诉，案件再进入审理。
          - list [ref=e79]:
            - listitem [ref=e80]: 需要检察监督时，可咨询 12309。
        - complementary [ref=e81]:
